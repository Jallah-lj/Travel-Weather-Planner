name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      AUTH_PROVIDER: local
      DATABASE_URL: sqlite:///./ci.db
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.supabase.config.ts
  postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-password-only
          POSTGRES_DB: planner
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://postgres:ci-password-only@localhost:5432/planner
      DATABASE_MIGRATION_URL: postgresql+psycopg://postgres:ci-password-only@localhost:5432/planner
      PGPASSWORD: ci-password-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: psql -h localhost -U postgres -d planner -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
      - run: alembic upgrade head
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d planner -f ../infrastructure/supabase-runtime-role.sql
      - run: python -m scripts.seed_production
      - run: python -m scripts.check_database_access
